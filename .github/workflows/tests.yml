name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit + regression tests
        run: python3 run_tests.py
      - name: Planted-drift corpus benchmark
        run: python3 benchmark/run_benchmark.py
      - name: Foreign-handoff test
        run: python3 benchmark/run_foreign.py
